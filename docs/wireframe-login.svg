<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="600" fill="#f2f2f2"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">SERUNI PRINTING</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#000000">Sistem Informasi Penjualan</text>

  <!-- Login card -->
  <rect x="240" y="130" width="320" height="330" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="240" y="130" width="320" height="44" rx="6" fill="#e8e8e8" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Login Administrator</text>

  <!-- Username -->
  <text x="268" y="218" font-size="13" font-weight="bold" fill="#000000">Username</text>
  <rect x="268" y="228" width="264" height="32" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="278" y="248" font-size="12" fill="#999999">Masukkan username</text>

  <!-- Password -->
  <text x="268" y="308" font-size="13" font-weight="bold" fill="#000000">Password</text>
  <rect x="268" y="318" width="264" height="32" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="278" y="338" font-size="12" fill="#999999">••••••••</text>

  <!-- Login button -->
  <rect x="268" y="380" width="264" height="40" rx="4" fill="#000000" stroke="#000000" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">LOGIN</text>

  <!-- Footer -->
  <text x="400" y="570" text-anchor="middle" font-size="11" fill="#666666">© 2026 Seruni Printing</text>
</svg>
